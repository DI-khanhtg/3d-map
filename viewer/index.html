<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rail Inspection Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="4 2.2" />
        <circle cx="16" cy="16" r="4" fill="currentColor" />
        <path d="M16 2v5M16 25v5M2 16h5M25 16h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
      </svg>
      <div>
        <div class="title" data-i18n="title">鉄道インフラ点検 3Dマップ</div>
        <div class="subtitle" id="subtitle">Drone × AI Inspection — Concept Demo</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn only-mobile" id="btnList" type="button" data-i18n="list">一覧</button>
      <div class="seg" id="campaigns" role="tablist" aria-label="検査年度"></div>
      <label class="tog"><input type="checkbox" id="tCompare" /> <span data-i18n="compare">前回比較</span></label>
      <label class="tog"><input type="checkbox" id="tFlights" checked /> <span data-i18n="flights">飛行ルート</span></label>
      <label class="tog"><input type="checkbox" id="tBldg" checked /> <span data-i18n="bldg">3D建物</span></label>
      <button class="btn" id="btnHome" type="button" data-i18n="home">全体表示</button>
      <button class="btn lang" id="btnLang" type="button">EN</button>
    </div>
  </header>

  <div id="map" aria-label="3D map"></div>

  <aside id="left" class="panel">
    <section class="card">
      <div class="card-head">
        <h2 data-i18n="pipeline">処理パイプライン</h2>
        <span class="chip" id="campaignChip"></span>
      </div>
      <ol class="pipeline" id="pipeline"></ol>
    </section>

    <section class="kpis" id="kpis"></section>

    <section class="card grow">
      <div class="card-head">
        <h2 data-i18n="prio">優先対応リスト</h2>
        <span class="muted small" data-i18n="prioSub">リスク順 · AI提案</span>
      </div>
      <ul class="prio" id="prio"></ul>
    </section>
  </aside>

  <aside id="detail" class="panel" hidden></aside>

  <div id="legend" class="panel"></div>

  <div id="strip" class="panel">
    <div class="strip-head">
      <span><span data-i18n="strip">キロ程ストリップ</span> <span class="muted" id="stripLen"></span></span>
      <span class="muted small" data-i18n="stripHint">クリックで区間へ移動</span>
    </div>
    <div class="strip-marks" id="stripMarks"></div>
    <div class="strip-track" id="stripTrack"></div>
    <div class="strip-labels" id="stripLabels"></div>
  </div>

  <div class="mock-banner" data-i18n="banner">デモ用の擬似点検データ · 線形 © OpenStreetMap contributors</div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data/rail_line.js"></script>
  <script src="data/inspection.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
